name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [test-py312, test-py313, test-py314, test-cloud]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to set the version

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: ${{ matrix.environment }}
          locked: true  # fail if pixi.lock is out of date with pyproject.toml
          cache: true

      - name: Run tests
        if: matrix.environment != 'test-py312'
        run: pixi run -e ${{ matrix.environment }} pytest -n auto

      - name: Run tests with coverage
        if: matrix.environment == 'test-py312'
        run: >
          pixi run -e ${{ matrix.environment }} pytest -n auto
          --cov=disp_xr --cov-report=term --cov-report=xml --cov-fail-under=80
          --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.environment == 'test-py312'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: pre-commit (ruff, mypy, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: test
          locked: true
          cache: true

      - name: Run pre-commit hooks
        run: pixi run -e test check

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to set the version

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: docs
          locked: true
          cache: true

      # Executes the gallery examples; a broken example or reference fails.
      - name: Build the docs
        run: pixi run -e docs mkdocs build --strict

  eof-example:
    name: eof example (xeofs, allowed to fail)
    runs-on: ubuntu-latest
    # xeofs has been quiet since early 2025: report breakage, never block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: eof
          locked: true
          cache: true

      - name: Run the residual EOF example
        run: pixi run -e eof python examples/eof_residuals.py

  coverage-badge:
    # A shields.io endpoint JSON on the `badges` branch, read by the README
    # badge; no external coverage service.
    name: coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-xml

      - name: Write the badge JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          percent = round(100 * rate)
          color = "brightgreen" if percent >= 90 else "green" if percent >= 80 else "orange"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{percent}%", "color": color}
          with open("coverage.json", "w") as f:
              json.dump(badge, f)
          PY

      - name: Push to the badges branch
        run: |
          git init -q badges && mv coverage.json badges/
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.json
          git commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" badges
