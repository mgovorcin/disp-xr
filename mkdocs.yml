site_name: disp-xr
site_description: Xarray tools for OPERA DISP surface displacement products
site_url: https://mgovorcin.github.io/disp-xr/
repo_url: https://github.com/mgovorcin/disp-xr
repo_name: mgovorcin/disp-xr
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  icon:
    logo: material/satellite-variant
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocs-jupyter:
      # Gallery examples are `# %%` scripts, executed at every build so a
      # broken example fails the build. Real-data notebooks read granules
      # that are not on the build machine: their saved outputs are shown.
      include: ["gallery/*.py", "real_data/*.ipynb"]
      execute: true
      execute_ignore: ["real_data/*.ipynb"]
      allow_errors: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false

exclude_docs: |
  check_plan.py
  real_data/*.py

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Try it on your frame: try-it.md
  - Tutorials:
      - gallery/index.md
      - Basics:
          - Quick look at a frame: gallery/quicklook.py
          - The command line, end to end: gallery/command_line.py
          - Exporting results: gallery/export.py
          - Chunks for maps and time series: gallery/chunking.py
      - Quality and references:
          - Quality layers and masking: gallery/quality_masks.py
          - Quality weights: gallery/quality_weights.py
          - Corrections and reference methods: gallery/reference.py
          - Line-of-sight geometry and plate motion: gallery/geometry.py
      - Time series:
          - Velocity from a trajectory fit: gallery/velocity.py
          - Velocity with colored-noise uncertainty: gallery/colored_noise.py
          - Checking a velocity fit: gallery/diagnostics.py
          - Denoising and regular time grids: gallery/denoise.py
      - Downsampling:
          - Downsampling with quality weights: gallery/downsample.py
      - GNSS:
          - Comparing DISP with GNSS: gallery/gnss_compare.py
          - Tying DISP to GNSS: gallery/gnss_tie.py
      - Real data:
          - Houston subsidence, end to end: real_data/houston.ipynb
          - Reading a frame across a production change: real_data/production_change.ipynb
          - Creep on the San Andreas Fault: real_data/san_andreas.ipynb
          - Troposphere that follows the terrain: real_data/troposphere.ipynb
          - Comparing two processing versions: real_data/versions.ipynb
      - Cloud and serving:
          - Virtual frames and versioned stores: gallery/virtual_frames.py
          - Serving results as web map tiles: gallery/web_tiles.py
          - Interactive browsing of a full frame: gallery/interactive.py
  - Guides:
      - Finding and reading granules remotely: remote.md
      - Choosing a velocity method: velocity-methods.md
      - Command line: cli.md
      - Large frames and batch jobs: performance.md
      - Product notes: product_notes.md
      - View in bowser: bowser.md
  - API reference:
      - api/index.md
      - Find and open: api/open.md
      - Process: api/process.md
      - Spatial models: api/models.md
      - GNSS: api/gnss.md
      - Export: api/export.md
      - Icechunk and virtual stores: api/cloud.md
      - Region batch jobs: api/batch.md
      - Plot: api/plot.md
      - Accessor: api/accessor.md
      - Settings and chunks: api/config.md
      - Synthetic data: api/tutorial.md
  - Development:
      - Project index: project_index.md
      - API review (v0.2): api_review.md
      - API policy: api_policy.md
      - Requirements (PRD): specs.md
      - Plan: todo.md
      - "Trade study: split metric (T29)": studies/split_metric.md
      - "GNSS validation (T34)": studies/gnss_validation.md
      - Code review: code_review.md
      - Porting from opera-utils: porting.md
      - References: references.md
