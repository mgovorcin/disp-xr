site_name: disp-xr
site_description: Xarray tools for OPERA DISP surface displacement products
site_url: https://mgovorcin.github.io/disp-xr/
repo_url: https://github.com/mgovorcin/disp-xr
repo_name: mgovorcin/disp-xr
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - mkdocs-jupyter:
      # Gallery examples are `# %%` scripts, executed at every build so a
      # broken example fails the build.
      include: ["gallery/*.py"]
      execute: true
      allow_errors: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false

exclude_docs: |
  check_plan.py

nav:
  - Home: README.md
  - Install: install.md
  - Getting started: getting-started.md
  - Finding and reading granules remotely: remote.md
  - Concepts: concepts.md
  - Product notes: product_notes.md
  - Choosing a velocity method: velocity-methods.md
  - Command line: cli.md
  - Large frames and batch jobs: performance.md
  - View in bowser: bowser.md
  - Try it on your frame: try-it.md
  - Gallery:
      - Quick look at a frame: gallery/quicklook.py
      - The command line, end to end: gallery/command_line.py
      - Quality layers and masking: gallery/quality_masks.py
      - Quality weights: gallery/quality_weights.py
      - Corrections and reference methods: gallery/reference.py
      - Line-of-sight geometry and plate motion: gallery/geometry.py
      - Downsampling with quality weights: gallery/downsample.py
      - Exporting results: gallery/export.py
      - Chunks for maps and time series: gallery/chunking.py
      - Velocity from a trajectory fit: gallery/velocity.py
      - Velocity with colored-noise uncertainty: gallery/colored_noise.py
      - Comparing DISP with GNSS: gallery/gnss_compare.py
      - Tying DISP to GNSS: gallery/gnss_tie.py
      - Checking a velocity fit: gallery/diagnostics.py
      - Denoising and regular time grids: gallery/denoise.py
      - Interactive browsing of a full frame: gallery/interactive.py
      - Virtual frames and versioned stores: gallery/virtual_frames.py
  - API reference:
      - Overview: api/index.md
      - Find and open: api/open.md
      - Process: api/process.md
      - Spatial models: api/models.md
      - GNSS: api/gnss.md
      - Export: api/export.md
      - Icechunk and virtual stores: api/cloud.md
      - Plot: api/plot.md
      - Accessor: api/accessor.md
      - Settings and chunks: api/config.md
      - Synthetic data: api/tutorial.md
  - Development:
      - Project index: INDEX.md
      - API review (v0.2): api_review.md
      - API policy: api_policy.md
      - Requirements (PRD): specs.md
      - Plan: todo.md
      - Code review: code_review.md
      - Porting from opera-utils: porting.md
      - References: references.md
