[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "disp_xr"
description = "OPERA DISP xarray tools"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
maintainers = [{ name = "Marin Govorcin", email = "marin.govorcin@jpl.nasa.gov" }]

# The version is written to src/disp_xr/_version.py on install (setuptools_scm).
dynamic = ["version"]

# Core dependencies only. disp-xr must not depend on opera_utils or verde
# (see docs/specs.md); the functions it needs are ported (docs/porting.md).
dependencies = [
  "click>=7.0",
  "dask",
  # Runtime settings (disp_xr.config); zarr also uses it.
  "donfig>=0.8",
  # Nested groups need >=3.1.6: earlier versions silently drop arrays.
  "zarr>=3.1.6",
  "flox",
  "fsspec",
  "h5netcdf",
  "h5py",
  "netcdf4",
  # Fast NaN-aware reductions (MIDAS medians): about 250x np.nanmedian.
  "numbagg",
  "numpy",
  "packaging",
  "pandas",
  "pydantic>=2.4",
  "pyproj",
  "pyyaml",
  "rasterio",
  # 0.23 writes the Zarr spatial: and proj: conventions.
  "rioxarray>=0.23",
  "scipy",
  # Caps BLAS threads inside dask tasks (per-pixel solvers).
  "threadpoolctl",
  "xarray",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-xdist", "cf_xarray"]
docs = [
  "mkdocs",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.29",
  "mkdocstrings-python>=1.16",
  "mkdocs-jupyter>=0.25",
  "ipykernel",
  "matplotlib",
]
# geepers is the GNSS engine (sources, downloads, sampling at stations).
# 0.4 brings the analysis and validation functions disp_xr.analysis wraps.
gnss = ["geepers>=0.4"]
# H3 hexagons (downsample_hex(grid="h3")) and cell polygons (to_geodataframe).
hex = ["h3>=4", "geopandas"]
# MintPy is used only to read exports back in round-trip tests.
mintpy = ["mintpy"]
plot = ["matplotlib"]
interactive = ["hvplot", "datashader"]
aws = [
  "aiohttp",
  "asf_search",
  "dem_stitcher",
  "requests",
  "s3fs",
  "shapely",
  "tile_mate",
]
# virtualizarr[icechunk] brings icechunk and obstore; 2.4 is the first release
# with the HDF parser API used here.
cloud = ["virtualizarr[hdf,icechunk]>=2.4"]
eof = ["xeofs"]
# Read-only REST service over stores (disp_xr serve, PRD C7).
serve = ["xpublish>=0.5", "xpublish-tiles>=0.9", "fastapi", "uvicorn", "pydantic>=2"]
# Optional backend for disp_xr.timeseries.jax_solve_linear_system.
jax = ["jax"]

[project.urls]
Homepage = "https://github.com/mgovorcin/disp-xr"
"Bug Tracker" = "https://github.com/mgovorcin/disp-xr/issues"

# Entry points for the command line interface
[project.scripts]
disp_xr = "disp_xr.cli:cli_app"

# pixi: `pixi install` (default env), `pixi install -e dev` (tests, linters,
# all extras), `pixi run test`, `pixi run check`. Conda dependencies mirror
# [project.dependencies]; keep the two lists in sync. pixi turns each
# [project.optional-dependencies] extra into a feature of the same name, so
# the features below only add conda builds of those packages.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
disp_xr = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12"
pip = ">=21.3"
git = "*"
click = ">=7.0"
dask = "*"
donfig = ">=0.8"
zarr = ">=3.1.6"
flox = "*"
fsspec = "*"
h5netcdf = "*"
h5py = "*"
netcdf4 = "*"
numbagg = "*"
numpy = "*"
packaging = "*"
pandas = "*"
pydantic = ">=2.4"
pyproj = "*"
pyyaml = "*"
rasterio = "*"
rioxarray = ">=0.23"
scipy = "*"
threadpoolctl = "*"
xarray = "*"
gdal = "*"
libgdal-hdf5 = "*"
libgdal-netcdf = "*"

[tool.pixi.tasks]
check = "pre-commit run -a"
test = "pytest"
cov = "pytest --cov=disp_xr --cov-report=term-missing --cov-fail-under=80"

[tool.pixi.feature.test.dependencies]
cf_xarray = "*"
# plot extra, so the quick-look smoke tests run in every test environment
matplotlib-base = "*"
# aws extra, so tests cover disp_xr.search and remote access
aiohttp = "*"
requests = "*"
s3fs = "*"
shapely = "*"
mypy = "*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
ruff = "*"
types-pyyaml = "*"
# hex extra, so the H3 and GeoDataFrame tests run in every test environment
h3-py = ">=4"
geopandas = "*"

# gnss extra: geepers is on PyPI only. Pinned to a main commit until 0.4 is
# released (it carries the analysis and validation functions); then ">=0.4".
[tool.pixi.feature.test.pypi-dependencies]
geepers = { git = "https://github.com/opera-adt/geepers.git", rev = "d5421787d9c41dbf7e4d0679249bb9d5145bcc40" }

# Web tiles with earth-mover's xpublish-tiles (PRD C5; one gallery page).
[tool.pixi.feature.tiles.pypi-dependencies]
xpublish-tiles = ">=0.9"

# pixi takes the serve extra's packages as this feature's; httpx2 is the
# in-process test client of Starlette (FastAPI).
[tool.pixi.feature.serve.pypi-dependencies]
httpx2 = "*"

# The GNSS gallery pages run geepers on synthetic stations (gnss extra).
[tool.pixi.feature.docs.pypi-dependencies]
geepers = { git = "https://github.com/opera-adt/geepers.git", rev = "d5421787d9c41dbf7e4d0679249bb9d5145bcc40" }

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-jupyter = ">=0.25"
mkdocs-material = ">=9.5"
# The gallery notebooks are executed at build time.
ipykernel = "*"
matplotlib-base = "*"
# Older pairs break against current griffe.
mkdocstrings = ">=0.29"
mkdocstrings-python = ">=1.16"
# The gallery runs H3 hexagons and to_geodataframe (hex extra).
h3-py = ">=4"
geopandas = "*"

[tool.pixi.feature.aws.dependencies]
asf_search = "*"
requests = "*"
s3fs = "*"
shapely = "*"

# Mirrors the cloud extra; the conda virtualizarr carries no extras metadata.
[tool.pixi.feature.cloud.dependencies]
h5py = "*"
icechunk = ">=2.0.3"
obstore = "*"
virtualizarr = ">=2.4"

# eof extra (xeofs): the residual EOF example, run in its own CI job.
[tool.pixi.feature.eof.dependencies]
xeofs = "*"
matplotlib-base = "*"

[tool.pixi.feature.plot.dependencies]
matplotlib = "*"

[tool.pixi.feature.interactive.dependencies]
datashader = "*"
hvplot = "*"

[tool.pixi.feature.mintpy.dependencies]
mintpy = "*"

[tool.pixi.feature.notebooks.dependencies]
folium = "*"
ipykernel = "*"
mapclassify = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
# CI matrix: one test environment per supported Python.
test-py312 = { features = ["test", "py312"], solve-group = "py312" }
test-py313 = { features = ["test", "py313"], solve-group = "py313" }
test-py314 = { features = ["test", "py314"], solve-group = "py314" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs", "interactive", "cloud", "tiles"], solve-group = "default" }
# Icechunk and VirtualiZarr (cloud extra); CI runs its tests in one job.
test-cloud = { features = ["test", "cloud"], solve-group = "default" }
# The REST service (serve extra) and its in-process client.
test-serve = { features = ["test", "serve", "cloud"], solve-group = "default" }
# The residual EOF example (xeofs); CI reports its breakage without failing.
eof = { features = ["test", "eof"], solve-group = "default" }
dev = { features = ["test", "aws", "cloud", "plot", "mintpy", "notebooks", "interactive"], solve-group = "default" }

[tool.setuptools]
# Ship third-party license texts for ported code (THIRD_PARTY_NOTICES.md).
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/disp_xr/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version


[tool.ruff]
src = ["src"]
force-exclude = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle (errors)
  "W",   # pycodestyle (warnings)
  "EXE", # flake8-executable
  "F",   # Pyflakes
  "I",   # isort
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "TID251", # banned imports, see [tool.ruff.lint.flake8-tidy-imports]
]

ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "N803",   # Argument name should be lowercase
  "N806",   # Variable _ in function should be lowercase
  "PIE796", # Non-unique values are redundant and likely a mistake.
  "PLR",    # Pylint Refactor
  "PTH123", # `open()` should be replaced by `Path.open()`
  "PTH207", # "Replace `glob` with `Path.glob` or `Path.rglob`
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# disp-xr ports what it needs from these and must not depend on them
# (docs/specs.md, docs/porting.md).
"opera_utils".msg = "disp-xr does not depend on opera_utils; port the function (docs/porting.md)"
"verde".msg = "verde is a design reference only; implement the estimator in disp_xr.models"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"tests/**" = ["D", "N", "PTH"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests", "src/disp_xr"]
# Doctests run on the package. Modules that need an optional extra or a
# dependency being removed are skipped until their plan task rewrites them:
# search and its alias
# download (aws extra), timeseries/_jax_solver (jax extra). tests/data holds
# scripts that write reference data in other environments (geepers).
addopts = """
  --doctest-modules
  --ignore=tests/data
  --ignore=src/disp_xr/search.py
  --ignore=src/disp_xr/download.py
  --ignore=src/disp_xr/timeseries/_jax_solver.py
"""
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"

filterwarnings = [
  "error",
  # DeprecationWarning thrown in pkg_resources for older numba verions and llvmlite
  # DeprecationWarning for raider cgi
  "ignore:.*pkg_resources.*",
  "ignore::DeprecationWarning",
  "ignore:h5py is running against HDF5.*:UserWarning",
  # netCDF4 wheels built against an older numpy ABI warn on import; harmless.
  "ignore:numpy.ndarray size changed:RuntimeWarning",
  # rioxarray multiplies affine transforms with `*`; affine plans to deprecate it.
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
  "ignore:Exception ignored in.* <_io.FileIO.*:pytest.PytestUnraisableExceptionWarning"
]
