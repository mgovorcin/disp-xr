[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "disp_xr"
description = "OPERA DISP xarray tools"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

# The version is written to src/disp_xr/_version.py on install (setuptools_scm).
dynamic = ["version"]

# Core dependencies only. disp-xr must not depend on opera_utils or verde
# (see docs/specs.md); the functions it needs are ported (docs/porting.md).
dependencies = [
  "click>=7.0",
  "dask",
  # Nested groups need >=3.1.6: earlier versions silently drop arrays.
  "zarr>=3.1.6",
  "flox",
  "fsspec",
  "h5netcdf",
  "h5py",
  "netcdf4",
  "numpy",
  "packaging",
  "pandas",
  "pydantic>=2.4",
  "pyproj",
  "pyyaml",
  "rasterio",
  # 0.23 writes the Zarr spatial: and proj: conventions.
  "rioxarray>=0.23",
  "scipy",
  "xarray",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-xdist", "cf_xarray"]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings>=0.29",
  "mkdocstrings-python>=1.16",
  "mkdocs-jupyter",
]
gnss = ["xvec", "geopandas"]
# MintPy is used only to read exports back in round-trip tests.
mintpy = ["mintpy"]
plot = ["matplotlib"]
interactive = ["hvplot", "datashader"]
aws = ["s3fs", "asf_search", "dem_stitcher", "tile_mate", "requests", "shapely"]
# virtualizarr[icechunk] brings icechunk and obstore; 2.4 is the first release
# with the HDF parser API used here.
cloud = ["virtualizarr[hdf,icechunk]>=2.4"]
eof = ["xeofs"]
# Optional backend for disp_xr.timeseries.jax_solve_linear_system.
jax = ["jax"]

[project.urls]
Homepage = "https://github.com/opera-adt/disp-xr"
"Bug Tracker" = "https://github.com/opera-adt/disp-xr/issues"

# Entry points for the command line interface
[project.scripts]
disp_xr = "disp_xr.cli:cli_app"

# pixi: `pixi install` (default env), `pixi install -e dev` (tests, linters,
# all extras), `pixi run test`, `pixi run check`. Conda dependencies mirror
# [project.dependencies]; keep the two lists in sync. pixi turns each
# [project.optional-dependencies] extra into a feature of the same name, so
# the features below only add conda builds of those packages.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
disp_xr = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12"
pip = ">=21.3"
git = "*"
click = ">=7.0"
dask = "*"
zarr = ">=3.1.6"
flox = "*"
fsspec = "*"
h5netcdf = "*"
h5py = "*"
netcdf4 = "*"
numbagg = "*"
numpy = "*"
packaging = "*"
pandas = "*"
pydantic = ">=2.4"
pyproj = "*"
pyyaml = "*"
rasterio = "*"
rioxarray = ">=0.23"
scipy = "*"
xarray = "*"
gdal = "*"
libgdal-hdf5 = "*"
libgdal-netcdf = "*"

[tool.pixi.tasks]
check = "pre-commit run -a"
test = "pytest"
cov = "pytest --cov=disp_xr --cov-report=term-missing"

[tool.pixi.feature.test.dependencies]
cf_xarray = "*"
mypy = "*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
ruff = "*"
types-pyyaml = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-jupyter = "*"
mkdocs-material = "*"
# Older pairs break against current griffe.
mkdocstrings = ">=0.29"
mkdocstrings-python = ">=1.16"

[tool.pixi.feature.aws.dependencies]
asf_search = "*"
requests = "*"
s3fs = "*"
shapely = "*"

[tool.pixi.feature.plot.dependencies]
matplotlib = "*"

[tool.pixi.feature.mintpy.dependencies]
mintpy = "*"

[tool.pixi.feature.notebooks.dependencies]
folium = "*"
ipykernel = "*"
mapclassify = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
# CI matrix: one test environment per supported Python.
test-py312 = { features = ["test", "py312"], solve-group = "py312" }
test-py313 = { features = ["test", "py313"], solve-group = "py313" }
test-py314 = { features = ["test", "py314"], solve-group = "py314" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["test", "aws", "plot", "mintpy", "notebooks"], solve-group = "default" }

[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/disp_xr/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version


[tool.ruff]
src = ["src"]
# The notebooks are rewritten as gallery examples in T16 (docs/todo.md).
extend-exclude = ["notebooks"]
force-exclude = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle (errors)
  "W",   # pycodestyle (warnings)
  "EXE", # flake8-executable
  "F",   # Pyflakes
  "I",   # isort
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "TID251", # banned imports, see [tool.ruff.lint.flake8-tidy-imports]
]

ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "N803",   # Argument name should be lowercase
  "N806",   # Variable _ in function should be lowercase
  "PIE796", # Non-unique values are redundant and likely a mistake.
  "PLR",    # Pylint Refactor
  "PTH123", # `open()` should be replaced by `Path.open()`
  "PTH207", # "Replace `glob` with `Path.glob` or `Path.rglob`
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# disp-xr ports what it needs from these and must not depend on them
# (docs/specs.md, docs/porting.md).
"opera_utils".msg = "disp-xr does not depend on opera_utils; port the function (docs/porting.md)"
"verde".msg = "verde is a design reference only; implement the estimator in disp_xr.models"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"tests/**" = ["D", "N", "PTH"]
# Last opera_utils import; removed by plan task T12.1.
"src/disp_xr/geometry/static.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests", "src/disp_xr"]
# Doctests run on the package. Modules that need an optional extra or a
# dependency being removed are skipped until their plan task rewrites them:
# geometry/static (imports opera_utils, T12), export/mintpy (mintpy extra, T14),
# their deprecated aliases static_layers and mintpy, download (aws extra,
# T4.5), timeseries/_jax_solver (jax extra).
addopts = """
  --doctest-modules
  --ignore=src/disp_xr/geometry/static.py
  --ignore=src/disp_xr/static_layers.py
  --ignore=src/disp_xr/export/mintpy.py
  --ignore=src/disp_xr/mintpy.py
  --ignore=src/disp_xr/download.py
  --ignore=src/disp_xr/timeseries/_jax_solver.py
"""
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"

filterwarnings = [
  "error",
  # DeprecationWarning thrown in pkg_resources for older numba verions and llvmlite
  # DeprecationWarning for raider cgi
  "ignore:.*pkg_resources.*",
  "ignore::DeprecationWarning",
  "ignore:h5py is running against HDF5.*:UserWarning",
  # netCDF4 wheels built against an older numpy ABI warn on import; harmless.
  "ignore:numpy.ndarray size changed:RuntimeWarning",
  "ignore:Exception ignored in.* <_io.FileIO.*:pytest.PytestUnraisableExceptionWarning"
]
