name: disp_xr
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12
  - pip>=21.3  # https://pip.pypa.io/en/stable/reference/build-system/pyproject-toml/#editable-installation
  - git  # for pip install, due to setuptools_scm
  # core (mirrors [project.dependencies] in pyproject.toml)
  - click>=7.0
  - dask
  - zarr>=3.1.6
  - flox
  - fsspec
  - h5netcdf
  - h5py
  - netcdf4
  - numpy
  - packaging
  - pandas
  - pydantic>=2.4
  - pyproj
  - pyyaml
  - rasterio
  - rioxarray>=0.23
  - scipy
  - xarray
  # xarray uses numbagg for faster NaN-aware reductions when present
  - numbagg
  - gdal
  - libgdal-hdf5
  - libgdal-netcdf
  # extras: aws
  - s3fs
  - asf_search
  - requests
  - shapely
  # extras: plot, mintpy
  - matplotlib
  - mintpy
  # notebooks/interactive_workflow.ipynb (GeoDataFrame.explore)
  - folium
  - mapclassify
  # dev
  - mypy
  - pre_commit
  - pytest
  - pytest-cov
  - pytest-xdist
  - ruff
  - types-PyYAML
  - pip:
      - dem_stitcher
      - tile_mate
